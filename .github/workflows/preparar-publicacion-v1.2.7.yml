name: Preparar publicacion IKIGAI v1.2.7
on:
  push:
    branches: [main]
    paths: ['.github/workflows/preparar-publicacion-v1.2.7.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Aplicar parche legible y generar publicacion
        run: |
          python3 .github/patches/v1.2.7/aplicar.py
          python3 construye_pages.py
          node --check sw.js
      - name: Verificar y preparar commit sin promover main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='javiergonzaleznegro/ikigai'
          root=pathlib.Path('.')
          def git_hash(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          expected={'work.html':'1bccb797c3a32b5ecec901187c0e97e704c15cf9','index.html':'1bccb797c3a32b5ecec901187c0e97e704c15cf9','construye_pages.py':'8e1e159c2f9ddfd41a2889e4787793b31a04c4f4','sw.js':'6ee6ffde2167668d86d042d7c32213a50dc4fa82','manifest.json':'2ab2235a57262fa01602c3884615c6b5b6f5e141','icon-180-v1.png':'3c8a8aa1e33505ef316c1a83b42b17a337e861e7','icon-512-v1.png':'3c07791b6a31c5e3ce48035abbf8beb35444bc44'}
          for name,digest in expected.items():
              assert git_hash((root/name).read_bytes())==digest,'Salida distinta: '+name
          html=(root/'work.html').read_text(encoding='utf-8')
          for source in re.findall(r'<script[^>]*>(.*?)</script>',html,re.S):
              subprocess.run(['node','--check'],input=source,text=True,check=True)
          assert (root/'work.html').read_bytes()==(root/'index.html').read_bytes()
          assert '<div class="fc-nodo fc-objetivos">' in html
          api_root='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def api(path,data=None):
              req=urllib.request.Request(api_root+path,headers=headers,data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=60) as response:
                  return json.load(response)
          head=os.environ['GITHUB_SHA']
          assert api('/git/ref/heads/main')['object']['sha']==head,'main ha cambiado; no publicar'
          tree_base=api('/git/commits/'+head)['tree']['sha']
          entries=[]
          for name in ['work.html','index.html','construye_pages.py','sw.js']:
              digest=expected[name]
              blob=api('/git/blobs',{'content':base64.b64encode((root/name).read_bytes()).decode(),'encoding':'base64'})
              assert blob['sha']==digest
              entries.append({'path':name,'mode':'100644','type':'blob','sha':digest})
          tree=api('/git/trees',{'base_tree':tree_base,'tree':entries})
          commit=api('/git/commits',{'message':'Publicar IKIGAI v1.2.7: version limpia y objetivos en Focalizar','tree':tree['sha'],'parents':[head]})
          print('COMMIT_PREPARADO='+commit['sha'])
          print('PARENT='+head)
          print('HTML_SHA256='+hashlib.sha256((root/'work.html').read_bytes()).hexdigest())
          print('ARCHIVOS_MODIFICADOS='+','.join(e['path'] for e in entries))
          PYTHON
