name: Publicar v1.3.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-v1.3.14.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir y validar HTML v1.3.14
        shell: bash
        run: |
          set -euo pipefail
          cat .github/publish-v1.3.14/final.gz.b64.part* | base64 -d | gzip -d > work.html
          cp work.html index.html
          echo 'e6946d908872254ae775053b02ce823144189db496082a17b532e9d06f01cbcc  work.html' | sha256sum -c -
          cmp -s work.html index.html
          grep -q '<title>Sistema de Mejora Personal — v1.3.14</title>' work.html
          grep -q '<meta name="version" content="1.3.14">' work.html
          grep -q '<p class="sello">v1.3.14</p>' work.html
          grep -q 'Pilares — 4A' work.html
          grep -q 'Mis cuatro pilares a reforzar' work.html
          ! grep -Eqi '>\s*(PROPUESTA|REUBICACIÓN|COMPROBACIÓN)\s*<' work.html

      - name: Generar PWA v1.3.14
        shell: bash
        run: |
          cat > sw.js <<'EOF'
          /* generado para v1.3.14 — no editar a mano */
          const CACHE = 'smp-1.3.14';
          const BASE = ['./', './index.html', './manifest.json',
                        './icon-180-v1.png', './icon-512-v1.png'];

          self.addEventListener('install', e => {
            self.skipWaiting();
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(BASE)).catch(() => {}));
          });

          self.addEventListener('activate', e => {
            e.waitUntil(
              caches.keys()
                .then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k))))
                .then(() => self.clients.claim())
            );
          });

          self.addEventListener('fetch', e => {
            const req = e.request;
            if (req.method !== 'GET') return;
            const url = new URL(req.url);
            if (url.origin !== self.location.origin) return;

            if (req.mode === 'navigate' || req.destination === 'document') {
              e.respondWith(
                fetch(req)
                  .then(r => {
                    const copia = r.clone();
                    caches.open(CACHE).then(c => c.put('./index.html', copia));
                    return r;
                  })
                  .catch(() => caches.match('./index.html').then(r => r || caches.match('./')))
              );
              return;
            }

            e.respondWith(
              caches.match(req).then(r => r || fetch(req).then(res => {
                const copia = res.clone();
                caches.open(CACHE).then(c => c.put(req, copia));
                return res;
              }))
            );
          });
          EOF

          cat > manifest.json <<'EOF'
          {
            "name": "Sistema de Mejora Personal",
            "short_name": "Sistema",
            "description": "Arquitectura Interior y Proceso Diario",
            "lang": "es",
            "start_url": "./index.html",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#131C30",
            "theme_color": "#131C30",
            "icons": [
              {"src": "./icon-180-v1.png", "sizes": "180x180", "type": "image/png"},
              {"src": "./icon-512-v1.png", "sizes": "512x512", "type": "image/png", "purpose": "any"},
              {"src": "./icon-512-v1.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable"}
            ]
          }
          EOF

          cat > README.md <<'EOF'
          # Sistema de Mejora Personal / IKIGAI

          Versión publicada **v1.3.14** (13/09/2026).

          ## Regla de publicación

          La página publicada no lleva etiquetas PROPUESTA, REUBICACIÓN ni marcas de comprobación. Esas marcas se reservan a versiones de revisión.

          ## Fuente y generación

          - `work.html`: fuente HTML limpia.
          - `index.html`: página publicada, idéntica a `work.html`.
          - `sw.js`: HTML network-first; caché `smp-1.3.14`.
          - `manifest.json`: manifiesto PWA.
          - iconos v1 existentes, conservados.

          ## Contenido de esta entrega

          - Escudo actualizado con Mirada, Actitud y Estado.
          - Lectura conceptual: qué cultivo / cómo lo entreno / cuándo lo practico.
          - Contemplación en Mirada → Filtros.
          - Activación cognitiva en Estado.
          - `Pilares — 4A` como desplegable en Funcionar, después de Áreas.

          SHA-256 de `work.html` e `index.html`: `e6946d908872254ae775053b02ce823144189db496082a17b532e9d06f01cbcc`.
          EOF

      - name: Publicar en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rf .github/publish-v1.3.14
          git add work.html index.html sw.js manifest.json README.md
          git commit -m 'Publicar Sistema de Mejora Personal v1.3.14'
          git push origin HEAD:main
