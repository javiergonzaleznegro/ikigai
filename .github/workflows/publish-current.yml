name: Publicar revisión actual de IKIGAI

on:
  push:
    paths:
      - ".github/workflows/publish-current.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir work.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          parts = sorted(Path('.publish_tmp').glob('*.txt'))
          payload = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          html = gzip.decompress(base64.b64decode(payload))
          Path('work.html').write_bytes(html)
          PY

      - name: Generar publicación
        run: python3 construye_pages.py

      - name: Limpiar y publicar
        shell: bash
        run: |
          rm -f 'sw (1).js'
          rm -rf .publish_tmp
          rm -f .github/workflows/publish-current.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publica revisión v1.1.0"
          git push
