<!DOCTYPE html>
<html lang="es" style="background:#131C30">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#131C30">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180-v1.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sistema">
<title>Sistema de Mejora Personal — v1.5.4</title>
<meta name="version" content="1.5.4">
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap');

:root{
  color-scheme: only dark;
  --fondo:#131C30;
  --papel:#FFFCF2;
  --carta-2:#FBF6E8;
  --tinta:#22406F;
  --tinta-suave:#54689A;
  --grafito:#69707E;
  --tiza:#EFE7D2;
  --tiza-suave:#C3CCE6;
  --mirada:#7FD4E2;
  --estado:#C889AE;
  --operar:#FFBE7E;
  --mental:#9BDD90;
  --proceso:#FFE461;
  --oscuro:#14203A;
  --mano:'Caveat','Segoe Print','Bradley Hand','Marker Felt','Noteworthy','Comic Sans MS',cursive;
  --texto:'Karla','Avenir Next','Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ancho-tarjeta:min(100%,720px); /* v1.4.4: un solo ancho para .dim y .fase en una columna */
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--fondo) !important}
body{
  background:
    radial-gradient(1100px 600px at 50% -100px, rgba(255,217,77,.05), transparent 60%),
    repeating-linear-gradient(to bottom, transparent 0, transparent 35px, rgba(239,231,210,.045) 35px, rgba(239,231,210,.045) 36px),
    var(--fondo) !important;
  color:var(--tinta);
  font-family:var(--texto);
  font-size:15.6px;line-height:1.5;
  padding:calc(26px + env(safe-area-inset-top)) clamp(10px,3vw,18px)
          calc(70px + env(safe-area-inset-bottom));
  print-color-adjust:exact;-webkit-print-color-adjust:exact;
}
.hoja{max-width:1220px;margin:0 auto}
html,body{overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
svg,img{max-width:100%}
p,div,span,li{overflow-wrap:break-word}

/* ================= cabecera ================= */
.cab{text-align:center;padding:4px 0 0}
.cab .marca{width:100%;max-width:760px;height:auto;margin:0 auto 18px;display:block}
.cab h1{font-family:var(--mano);font-size:clamp(36px,6.6vw,58px);font-weight:700;line-height:1;color:var(--tiza)}
.cab .doble{width:250px;max-width:62%;margin:8px auto 0}
.cab .doble line{stroke:var(--tiza);stroke-width:2.6;stroke-linecap:round}
.mapa-niveles{margin:28px auto 0;max-width:1000px;width:100%;display:block}

.mapa-niveles text{font-family:var(--texto);fill:var(--tinta)}
.mapa-niveles .caja{fill:var(--papel);stroke:#22406F;stroke-width:2}
.mapa-niveles .tit{font-weight:700;letter-spacing:.06em;font-size:29px}
.mapa-niveles .cab{fill:#22406F;stroke:none}
.mapa-niveles .titc{font-weight:700;letter-spacing:.05em;font-size:23px;fill:var(--papel)}
.mapa-niveles .panel{fill:rgba(239,231,210,.045);stroke:rgba(239,231,210,.16);stroke-width:1.2}
.mapa-niveles .nom{font-weight:700;letter-spacing:.02em;font-size:22px;fill:var(--tinta)}
.mapa-niveles .nom--arq{font-size:20.8px;letter-spacing:.004em}
.mapa-niveles .nom--arq-inf{font-size:19.4px;letter-spacing:.004em}
.mapa-niveles .pie2{font-size:19.5px;fill:var(--tiza);font-style:italic}
.mapa-niveles .clave{font-size:15.5px;fill:var(--tinta-suave);letter-spacing:.08em}
.mapa-niveles .pata{font-size:12px;fill:var(--tiza-suave);letter-spacing:0;text-anchor:start}
.mapa-niveles .pata--s{font-size:11.5px}
.mapa-niveles .pn{fill:var(--tiza);font-weight:700}
.mapa-niveles .rama{stroke:var(--tiza-suave);stroke-width:1.4;fill:none;opacity:.55}
.mapa-niveles .arq-llave{stroke-width:1.8;opacity:.9}

/* ================= capas ================= */
.capa{margin-top:46px}
.capa-cab{display:flex;align-items:center;gap:15px;flex-wrap:wrap;color:var(--tiza)}
.capa-cab .galon{width:33px;height:16.5px;flex:none;opacity:.92}
.capa-cab .regla{flex:1;min-width:40px;height:0;border-top:1.4px solid var(--tiza-suave);opacity:.45}
.capa-cab h2{font-size:clamp(19px,3.9vw,27px);font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.ley{font-family:var(--mano);font-size:23px;color:var(--tiza-suave);margin:2px 0 20px 52px}
.ley::before{content:"↳ ";opacity:.6}

.dims{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
.dims--herramientas{margin-top:28px}
/* v1.4.2 — lectura vertical estable también en iPad: las tres dimensiones y los tres mecanismos
   aparecen siempre uno debajo de otro, centrados, sin cortes de rótulo. */
.dims--superior>details.dim,.dims--herramientas>details.dim{width:var(--ancho-tarjeta);justify-self:center}
@media(min-width:760px){:root{--ancho-tarjeta:min(90%,720px)}}
.plano{grid-column:1/-1;margin:18px 0 2px;color:var(--tiza);text-align:center}
.plano:first-child{margin-top:2px}
.plano h3{font-size:clamp(17px,2.9vw,20.5px);font-weight:700;letter-spacing:.02em;margin:0}
.plano .sub{display:block;font-family:var(--mano);font-size:21px;color:var(--tiza-suave);margin-top:1px}

/* ---- tarjetas desplegables ---- */
details.dim, details.fase{position:relative}
details.dim>summary, details.fase>summary{list-style:none;cursor:pointer;user-select:none}
details.dim>summary::-webkit-details-marker, details.fase>summary::-webkit-details-marker{display:none}
.abre{
  font-family:var(--mano);font-size:24px;color:var(--tinta-suave);line-height:1;
  transition:transform .18s;
}
details[open]>summary .abre{transform:rotate(45deg)}

.dim{
  background:var(--papel);border:1.6px solid var(--tinta);
  border-radius:4px 16px 4px 14px;padding:14px 14px 16px;
  box-shadow:0 12px 28px rgba(0,0,0,.5);
}
.dim--mirada{border-top:7px solid var(--mirada)}
.dim--operar{border-top:7px solid var(--operar)}
.dim--mental{border-top:7px solid var(--mental)}
.dim--estado{border-top:7px solid var(--estado);--arq-acento:var(--estado)}
.dim--calibrar{border-top:7px solid var(--tiza-suave);--arq-acento:var(--tiza-suave)}
.c-estado{background:linear-gradient(180deg,transparent 55%,rgba(200,137,174,.42) 55%)}
.c-calibrar{background:linear-gradient(180deg,transparent 55%,rgba(195,204,230,.68) 55%)}
.dim-cab{display:grid;grid-template-columns:42px minmax(0,1fr) 28px;align-items:center;gap:8px}
.dim-cab>.abre{justify-self:center}
.dim-cab>.ico{justify-self:center}
.dim-cab .ico{width:34px;height:34px;flex:none}
.dim-cab .ico--cal{width:40px;height:40px}
.dim-cab .ico--rosa{width:42px;height:42px}
.dim--mental .dim-cab .ico--rosa,.dim--operar .dim-cab .ico--rosa,.dim--calibrar .dim-cab .ico--cal{justify-self:start;transform:translateX(-2px)}
.dim-cab h3{font-size:clamp(17.5px,4.7vw,23px);font-weight:700;letter-spacing:.055em;text-transform:uppercase;min-width:0}
.c-mirada{background:linear-gradient(180deg,transparent 55%,rgba(127,212,226,.55) 55%)}
.c-operar{background:linear-gradient(180deg,transparent 55%,rgba(255,190,126,.55) 55%)}
.c-mental{background:linear-gradient(180deg,transparent 55%,rgba(155,221,144,.55) 55%)}
.dim--actitud{border-top:7px solid var(--proceso)}
.cita{margin:12px 0 2px;padding:9px 13px;border-left:3px solid var(--proceso);background:var(--carta-2);font-size:13.8px;color:var(--grafito);line-height:1.6}
.cita b{color:var(--tinta)}
.cita .fuente{display:block;margin-top:6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-suave)}
.eyebrow{font-size:11.4px;letter-spacing:.15em;text-transform:uppercase;color:var(--grafito);margin:4px 0 0 44px}
.dim-body{margin-top:6px}


/* -------- conceptos desplegables -------- */
.concepto{border-bottom:1px dotted rgba(34,64,111,.2)}
.concepto:last-child{border-bottom:none}
.concepto>summary{
  list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;
  padding:5px 2px;font-size:14.6px;font-weight:700;user-select:none;color:var(--tinta);
}
.concepto>summary::-webkit-details-marker{display:none}
.filtro-ico{width:18px;height:18px;flex:0 0 18px;align-self:center;color:var(--tinta)}
.filtro-ico--sol{width:19px;height:19px;flex-basis:19px}
.concepto--icono>summary::before{display:none}
.concepto>summary::before{
  content:"";width:6px;height:6px;border:1.5px solid var(--tinta);border-radius:50%;
  flex:none;transform:translateY(-1px);
}
.concepto[open]>summary::before{background:var(--tinta)}
.concepto>summary .mas{
  margin-left:auto;font-family:var(--mano);font-size:20px;color:var(--tinta-suave);
  transition:transform .18s;line-height:1;
}
.concepto[open]>summary .mas{transform:rotate(45deg)}
.concepto .def{font-size:14px;color:var(--grafito);padding:0 4px 8px 16px;line-height:1.5}
.concepto .def b{color:var(--tinta)}
.pend{color:var(--tinta-suave);font-style:italic}
.subdef{margin:2px 0 8px 18px;padding-left:10px;border-left:1.6px dotted rgba(34,64,111,.35);font-size:13.6px;color:var(--grafito)}
.subdef b{color:var(--tinta)}
.subdef .fila{padding:4px 0}
.esq{margin:4px 0 8px 12px;padding-left:12px;border-left:1.6px dotted rgba(34,64,111,.35)}
.esq .paso-e{display:flex;align-items:flex-start;gap:8px;font-size:13.4px;line-height:1.45;color:var(--grafito);padding:2.5px 0}
.esq .n{flex:none;width:17px;height:17px;margin:1px 8px 0 0;border:1.4px solid var(--tinta);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--tinta)}
.esq i{color:var(--grafito)}
.basket-pareja{display:grid;grid-template-columns:repeat(2,minmax(0,160px));justify-content:start;gap:4px 8px;padding:3px 0;border-bottom:1px dotted rgba(34,64,111,.16)}
.basket-pareja:last-child{border-bottom:0}
.basket-pareja .paso-e{padding:2px 0}
@media(max-width:430px){.basket-pareja{grid-template-columns:repeat(2,minmax(0,145px));gap:2px 6px}}

/* ================= cuadrantes ================= */
.cuadrante{
  position:relative;margin:10px auto 0;max-width:540px;width:100%;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  border:2.2px solid var(--tinta);background:var(--carta-2);
}
.q{padding:12px 10px;min-height:96px;position:relative;text-align:center}
.q:nth-child(2){border-left:2.2px solid var(--tinta)}
.q:nth-child(3){border-top:2.2px solid var(--tinta)}
.q:nth-child(4){border-top:2.2px solid var(--tinta);border-left:2.2px solid var(--tinta)}
.q:nth-child(1){padding-bottom:26px}
.q:nth-child(2){padding-bottom:26px}
.q:nth-child(3){padding-top:26px}
.q:nth-child(4){padding-top:26px}
.q .qcab{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.q .qico{width:21px;height:21px;flex:none}
.q .elem{font-size:11.2px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:1px 7px;border-radius:2px;color:var(--oscuro)}
.q .fn{font-family:var(--mano);font-size:17.5px;color:var(--tinta-suave);display:block;line-height:1.1;margin:3px 0 4px}
.q .titq{font-size:14px;font-weight:700;display:inline;background:linear-gradient(180deg,transparent 55%,rgba(255,228,97,.75) 55%);color:var(--tinta)}
.q .cont{font-size:13px;color:var(--grafito);line-height:1.5;margin-top:4px}
.q .pares{font-size:13px;line-height:1.6;margin-top:4px;color:var(--tinta-suave)}
.q .pares b{font-weight:700;color:var(--tinta)}
.q .pares i{color:var(--grafito)}
.centro{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1.2deg);
  background:var(--proceso);border:2.2px solid var(--tinta);color:var(--oscuro);
  font-weight:700;letter-spacing:.11em;font-size:13.2px;padding:3px 12px;
  box-shadow:2px 2px 0 rgba(34,64,111,.3);white-space:nowrap;pointer-events:none;z-index:2;
}
.q--fuego{background:linear-gradient(160deg,#FFF0E4,transparent 70%)} .q--fuego .elem{background:#FF9E66}
.q--tierra{background:linear-gradient(200deg,#F5EEDB,transparent 70%)} .q--tierra .elem{background:#CBB98A}
.q--aire{background:linear-gradient(20deg,#EAF7FD,transparent 70%)} .q--aire .elem{background:#BFE6F5}
.q--agua{background:linear-gradient(340deg,#E9F1FC,transparent 70%)} .q--agua .elem{background:#8FB6EE}
.p--a{background:linear-gradient(160deg,#EDF9EA,transparent 70%)}
.p--b{background:linear-gradient(200deg,#E8F7FB,transparent 70%)}
.p--c{background:linear-gradient(20deg,#EEF3FD,transparent 70%)}
.p--d{background:linear-gradient(340deg,#FDEEF0,transparent 70%)}
.preg .q{min-height:120px}
.preg .cont{font-size:12.8px;line-height:1.55;color:var(--tinta-suave)}
.preg .cont b{color:var(--tinta);font-weight:700}
.pares-ico{list-style:none;margin-top:6px}
.pares-ico li{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px;
  font-size:12.2px;line-height:1.35;color:var(--tinta-suave);padding:2px 0;border:none;position:static}
.pares-ico li::before{content:none}
.pares-ico .mini{width:17px;height:17px;flex:none}
.pares-ico b{color:var(--tinta);font-weight:700}
.pares-ico i{color:var(--grafito)}

/* ================= senda mentalización ================= */
/* ================= proceso ================= */
.ciclo{display:grid;gap:18px;grid-template-columns:1fr}
.ciclo>details.fase{width:var(--ancho-tarjeta);justify-self:center}
@media(min-width:960px){.ciclo{grid-template-columns:repeat(3,1fr);align-items:start}.ciclo>details.fase{width:100%;justify-self:stretch}}
.fase{
  border:1.6px solid var(--tinta);border-radius:16px 4px 16px 4px;
  background:var(--papel);padding:12px 12px 14px;
  box-shadow:0 12px 28px rgba(0,0,0,.5);
  border-top:7px solid var(--proceso);
}
.fase h3{font-size:26px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:0;line-height:1.1}
.fase-tit{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 0}
.fase-tit .fico{width:29px;height:29px;flex:none}
.fase .rol{text-align:center;font-family:var(--mano);font-size:22px;color:var(--tinta-suave);margin:0;line-height:1.15}
.fase>summary .abre{position:absolute;top:10px;right:14px}
.fase-body{margin-top:4px}
.simbolo{width:100%;max-width:292px;display:block;margin:2px auto 0}
.simbolo--term{max-width:334px}
.simbolo .et{font-family:var(--mano);font-size:17px;fill:var(--tinta-suave)}
.simbolo .et2{font-family:var(--mano);font-size:13.4px;fill:var(--tinta-suave)}
.fase ul{list-style:none}
.fase>div>ul>li{border-bottom:1px dotted rgba(34,64,111,.18)}
.fase>div>ul>li:last-child{border-bottom:none}
.fase-body>ul>li>.concepto>summary{font-size:17px;letter-spacing:.11em;text-transform:uppercase;padding:11px 2px}
.fase-body>ul>li>.concepto>summary::before{width:9px;height:9px;border-width:2px;background:var(--proceso)}
.fase-body>ul>li>.concepto[open]>summary::before{background:var(--tinta)}
.fase-body>ul>li>.concepto>summary .mas{font-size:24px}
.pastilla{display:inline-block;font-size:13.2px;font-weight:700;border:1.5px solid var(--tinta);
  border-radius:11px 3px 11px 3px;padding:3px 10px;background:#FFF6D2;color:var(--tinta);
  margin:0 8px 0 0;flex:none}
.fila-p{display:flex;align-items:baseline;gap:2px;flex-wrap:wrap;margin:7px 0 7px 16px;font-size:13.6px;
  line-height:1.5;color:var(--grafito)}
.fila-p i{color:var(--tinta-suave)}
.bloque-prep{border:1.4px dashed rgba(34,64,111,.45);border-radius:9px;padding:8px 10px 9px 8px;margin:11px 14px 11px 8px}
.pastillas{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px 16px}
.fase--term .concepto>summary{font-size:17px;padding:9px 2px}
.fase--term .concepto>summary::before{width:8px;height:8px}
.fase--term .concepto .def{font-size:15.6px;line-height:1.6;padding:2px 4px 8px 18px}
.rot{margin:10px 0 2px 16px;font-size:14.6px;font-weight:700;color:var(--tinta)}
.rot i{font-weight:400;color:var(--tinta-suave)}
.lista{list-style:none;margin:2px 0 8px 18px;padding:0}
.lista>li{position:relative;padding:2px 0 2px 17px;font-size:14.2px;color:var(--grafito);line-height:1.5}
.lista>li::before{content:"";position:absolute;left:1px;top:9px;width:6px;height:6px;border-radius:50%;
  background:var(--proceso);border:1.4px solid var(--tinta)}
.lista>li i{color:var(--tinta-suave)}
.lista>li b{color:var(--tinta)}
.practicas-cajones{display:grid;gap:10px;margin:8px 4px 12px 16px}
.practica-grupo{border:1.3px solid rgba(34,64,111,.28);border-radius:10px 4px 10px 4px;background:var(--carta-2);padding:2px 10px 7px}
.practica-grupo>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 0 5px;font-size:14.4px;font-weight:700;color:var(--tinta)}
.practica-grupo>summary::-webkit-details-marker{display:none}
.practica-grupo>summary::before{content:"";width:7px;height:7px;border:1.5px solid var(--tinta);border-radius:50%;flex:none}
.practica-grupo[open]>summary::before{background:var(--tinta)}
.practica-grupo .lista{margin-left:0}
.practica-grupo .lista li{padding-left:14px}
.practica-grupo .subgrupo{font-size:13.6px;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta);margin:7px 0 4px 2px;text-decoration-line:underline;text-decoration-style:solid;text-decoration-thickness:1px;text-decoration-color:var(--tinta);text-underline-offset:3px}


.lista .concepto{border-bottom:none}
.lista .concepto>summary{font-size:14.2px;font-weight:400;color:var(--grafito);padding:2px 2px}
.lista .concepto>summary::before{display:none}
.lista .concepto>summary b{font-weight:700;color:var(--tinta)}
.ramas{width:100%;max-width:620px;margin:14px auto 6px;display:block}
.ramas .ram{font-family:var(--texto);font-size:15.6px;font-weight:700;fill:var(--tinta)}
.ramas .ram2{font-family:var(--texto);font-size:13.2px;font-style:italic;fill:var(--tinta-suave)}
.tira{margin-top:12px;border-top:1.6px solid var(--tinta);padding-top:8px}
.tira .titt{font-family:var(--mano);font-size:19px;color:var(--tinta-suave)}
.tramos{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tramo{font-size:11.4px;border:1.2px solid var(--tinta);background:#fff;border-radius:3px;padding:2px 6px;color:var(--tinta)}
.tramo b{display:block;font-size:10.8px;color:var(--grafito);font-weight:500}

.pie{text-align:center;margin-top:38px}
.pie .vpq{font-family:var(--mano);font-size:30px;color:var(--tiza)}
.pie small{display:block;font-size:11.2px;letter-spacing:.2em;text-transform:uppercase;color:var(--tiza-suave);margin-top:2px}

@media (prefers-reduced-motion:no-preference){
  .dim,.fase{transition:transform .18s ease,box-shadow .18s ease}
  .dim:hover,.fase:hover{transform:translate(-1px,-2px);box-shadow:0 16px 34px rgba(0,0,0,.6)}
}

.marca-final{margin:54px auto 10px;text-align:center;max-width:520px}
.marca-final svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.marca-pie{margin-top:14px;color:var(--tiza);opacity:.72;font-size:13.8px;letter-spacing:.04em;line-height:1.7}
.marca-pie small{display:block;margin-top:6px;font-size:11.2px;opacity:.72}

@media(max-width:430px){.ph-modo{grid-template-columns:70px minmax(70px,1fr) 40px;gap:6px}.ph-nombre{font-size:10px}.ph-ejes{margin-left:76px;margin-right:46px}.ph-pregunta{font-size:18px}}

@media(max-width:430px){.cadena-proposito--papel .cp-fila{gap:4px}.cadena-proposito--papel .cp-nodo{padding:9px 3px 8px}.cadena-proposito--papel .cp-nodo b{font-size:13.2px}.cadena-proposito--papel .cp-nodo span{font-size:10.2px}.cadena-proposito--papel .cp-nodo span small{font-size:8.2px}}
.cuadrante--compacto{max-width:540px}
/* v1.2.3 — revisión de contenido y proporciones. Reglas acotadas a cada componente. */

.arranque-simple{text-align:center;margin:7px auto 15px;padding:13px 8px 8px;max-width:330px}
.arranque-simple .pastilla{font-size:18px;line-height:1.25;padding:9px 20px;margin:0;background:var(--proceso)}

/* La estrella y Preguntarse comparten centro, también con el cuadrante desplegado. */
.rezo-estrella{container-type:inline-size;max-width:540px;margin:12px auto 14px;padding:6px 0;text-align:center}
.rezo-star-grid{display:grid;width:100%;max-width:350px;margin:0 auto;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);grid-template-rows:auto 76px;gap:5px 8px;align-items:center}
.rezo-nodo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tinta);font-weight:700;font-size:11.2px;line-height:1.1;text-align:center;min-width:0}

.rezo-preguntas{margin:9px auto 0;max-width:540px}
.rezo-preguntas>summary{list-style:none;cursor:pointer;width:max-content;max-width:100%;margin:0 auto;display:grid;grid-template-columns:22px auto 22px;grid-template-rows:auto auto;gap:3px 2px;align-items:center;justify-content:center;color:var(--tinta);font-weight:700;font-size:11.5px;line-height:1.1;min-height:54px}

.rezo-preguntas>summary .mas{grid-column:3;grid-row:2;align-self:start;justify-self:center;font:20px/1 var(--mano);color:var(--tinta-suave);transition:transform .18s;margin:0}
.rezo-preguntas[open]>summary .mas{transform:rotate(45deg)}
.rezo-preguntas .cuadrante{margin:13px auto 3px;max-width:540px}
/* Árbol de repaso: texto HTML legible, no encogido por el viewBox. */
.repaso-diagrama{max-width:540px;margin:15px auto;padding:12px 8px 9px;container-type:inline-size;position:relative}
.rm-origen{position:relative;width:fit-content;max-width:100%;margin:0 auto;padding:7px 18px 6px;text-align:center;border:1.6px solid var(--tinta);border-radius:18px;background:#FFF6D2}
.rm-origen b{display:block;font-size:14px;letter-spacing:.045em;line-height:1.25}
.rm-origen span{display:block;font:17px/1.15 var(--mano);color:var(--tinta-suave);margin-top:2px}
.rm-origen::after{content:"";position:absolute;left:50%;bottom:-25px;height:24px;border-left:1.4px solid var(--tinta)}
.rm-resultados{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;position:relative;margin-top:39px}
.rm-resultados::before{content:"";position:absolute;top:-12px;left:calc((100% - 24px)/6);right:calc((100% - 24px)/6);border-top:1.4px solid var(--tinta)}
.rm-rama{position:relative;min-width:0}
.rm-rama::before{content:"";position:absolute;left:50%;top:-12px;height:12px;border-left:1.4px solid var(--tinta)}
.rm-caja{height:100%;min-height:50px;padding:7px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;border:1.4px solid var(--tinta);border-radius:5px;background:var(--carta-2)}
.rm-caja b{font-size:13px;line-height:1.2}
.rm-caja span{font-size:11.4px;line-height:1.2;color:var(--tinta-suave)}
.rm-capturar{position:relative;z-index:3;width:max-content;margin:8px auto -25px;padding:1px 6px;background:var(--papel);font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--tinta);text-transform:uppercase}
@container (max-width:420px){
  .rm-origen::after{bottom:-42px;height:41px}
  .rm-capturar{margin:12px auto 10px;padding:1px 8px}
  .rm-resultados{grid-template-columns:1fr;gap:8px;padding-left:18px;margin:30px 10px 0}
  .rm-resultados::before{left:0;right:auto;top:-24px;bottom:25px;border-top:none;border-left:1.4px solid var(--tinta)}
  .rm-resultados::after{content:"";position:absolute;top:-24px;left:0;right:50%;border-top:1.4px solid var(--tinta)}
  .rm-rama::before{left:-18px;top:50%;height:0;width:18px;border-left:none;border-top:1.4px solid var(--tinta)}
  .rm-caja{min-height:45px;padding:9px 12px}
}
@container (max-width:330px){
  .rezo-star-grid{grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);grid-template-rows:auto 66px;gap:5px}
  .rezo-centro{width:60px;height:66px}.rezo-centro svg{width:60px;height:60px}

}

/* v1.3.6 — 4A: cuatro prioridades de práctica al mismo nivel, no una secuencia.

.triple-a{container-type:inline-size;container-name:triplea;max-width:540px;margin:12px auto 9px;padding:13px 12px 11px;border:1px solid rgba(34,64,111,.3);border-top:3px solid var(--proceso);border-radius:10px 3px 10px 3px;background:var(--carta-2);scroll-margin-top:18px}
